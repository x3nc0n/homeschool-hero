name: Squad Security Triage

on:
  issues:
    types:
      - opened
      - reopened
      - edited
      - labeled

permissions:
  contents: read
  issues: write

concurrency:
  group: squad-security-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: startsWith(github.event.issue.title, '[Security]') || contains(join(github.event.issue.labels.*.name, ','), 'security') || github.event.label.name == 'security'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Analyze security issue
        run: |
          python scripts/triage-security-issue.py \
            --event "$GITHUB_EVENT_PATH" \
            --repo-root . \
            --output security-triage.json

      - name: Apply triage labels and comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('security-triage.json', 'utf8'));
            if (!result.managed) {
              core.info('Issue is not managed by security triage automation.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.issue.number;
            const currentLabels = (context.payload.issue.labels || []).map(label => label.name);

            for (const label of result.labels_to_remove || []) {
              if (!currentLabels.includes(label)) {
                continue;
              }
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: label });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const labelsToAdd = (result.labels_to_add || []).filter(label => !currentLabels.includes(label));
            if (labelsToAdd.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: labelsToAdd });
            }

            const marker = '<!-- squad-security-triage -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => (comment.body || '').includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: result.comment_body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: result.comment_body,
              });
            }

            core.info(`Security issue triaged as ${result.category}.`);
