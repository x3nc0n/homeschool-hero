name: Publish feature container

on:
  push:
    branches:
      - x3nc0n-danny-preparing-local-ai-hosting

permissions:
  contents: read
  packages: write

jobs:
  postgres-migrations:
    name: Verify fresh PostgreSQL migration cycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homeschool_hero_ci
          POSTGRES_USER: homeschool
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeschool -d homeschool_hero_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify empty-database migration cycle
        env:
          APP_ENV: test
          TESTING: '1'
          DATABASE_URL: postgresql+asyncpg://homeschool:changeme@127.0.0.1:5432/homeschool_hero_ci
        run: bash scripts/migrate.sh verify

  publish:
    name: Build and publish commit image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: postgres-migrations
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push commit image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Feature-branch Homeschool Hero image
          provenance: mode=max
