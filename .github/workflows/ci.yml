name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  COVERAGE_FAIL_UNDER: '80'
  CI_IMAGE_NAME: homeschool-hero:ci

jobs:
  backend-test-matrix:
    name: Backend tests (${{ matrix.python-version }} / ${{ matrix.category }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        category: [unit, integration, performance]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt
          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

      - name: Select pytest marker expression
        id: marker
        run: |
          case "${{ matrix.category }}" in
            unit)
              echo "expression=not integration and not performance" >> "$GITHUB_OUTPUT"
              ;;
            integration)
              echo "expression=integration" >> "$GITHUB_OUTPUT"
              ;;
            performance)
              echo "expression=performance" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run pytest category
        env:
          TESTING: '1'
        run: |
          rm -rf .pytest-state
          python -m pytest -q -m "${{ steps.marker.outputs.expression }}" --junitxml="test-results-${{ matrix.python-version }}-${{ matrix.category }}.xml"

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-junit-${{ matrix.python-version }}-${{ matrix.category }}
          path: backend/test-results-${{ matrix.python-version }}-${{ matrix.category }}.xml
          if-no-files-found: ignore

  backend-coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt
          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

      - name: Run pytest with coverage
        env:
          TESTING: '1'
        run: |
          rm -rf .pytest-state
          python -m pytest -q --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results-coverage.xml --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/test-results-coverage.xml
          if-no-files-found: ignore

  backend-tests:
    name: Backend quality gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-test-matrix
      - backend-coverage
    steps:
      - name: Enforce backend gate
        run: |
          if [ "${{ needs.backend-test-matrix.result }}" != "success" ] || [ "${{ needs.backend-coverage.result }}" != "success" ]; then
            echo "Backend matrix or coverage failed."
            exit 1
          fi

  migration-checks:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homeschool_hero_ci
          POSTGRES_USER: homeschool
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeschool -d homeschool_hero_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f backend/requirements-test.txt ]; then
            python -m pip install -r backend/requirements-test.txt
          fi

      - name: Lint migration files
        env:
          APP_ENV: test
          TESTING: '1'
          DATABASE_URL: postgresql+asyncpg://homeschool:changeme@127.0.0.1:5432/homeschool_hero_ci
        run: |
          bash scripts/migrate.sh lint

      - name: Verify Alembic migrations
        env:
          APP_ENV: test
          TESTING: '1'
          DATABASE_URL: postgresql+asyncpg://homeschool:changeme@127.0.0.1:5432/homeschool_hero_ci
        run: |
          bash scripts/migrate.sh verify

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect npm scripts
        id: scripts
        run: |
          node <<'EOF'
          const scripts = require('./package.json').scripts || {};
          const fs = require('fs');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_lint=${Boolean(scripts.lint)}\nhas_test=${Boolean(scripts.test)}\n`,
          );
          EOF

      - name: Run lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm test

  container-checks:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --pull -t "${CI_IMAGE_NAME}" .

      - name: Scan image with Trivy policy gate
        id: trivy-policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignorefile: .trivyignore

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignorefile: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Enforce Trivy vulnerability policy
        if: steps.trivy-policy.outcome == 'failure'
        run: |
          echo "Trivy found HIGH or CRITICAL vulnerabilities."
          exit 1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: 'true'

  pr-test-summary:
    name: PR test summary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && always()
    needs:
      - backend-test-matrix
      - backend-coverage
      - frontend-tests
    steps:
      - name: Download junit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-junit-*
          path: artifacts/junit
          merge-multiple: true

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage
          path: artifacts/coverage
          merge-multiple: true

      - name: Build summary comment
        env:
          BACKEND_MATRIX_RESULT: ${{ needs.backend-test-matrix.result }}
          BACKEND_COVERAGE_RESULT: ${{ needs.backend-coverage.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          python <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          junit_dir = Path('artifacts/junit')
          rows = []
          for path in sorted(junit_dir.glob('*.xml')):
              root = ET.parse(path).getroot()
              suite = root if root.tag == 'testsuite' else root.find('testsuite')
              tests = int(suite.attrib.get('tests', 0))
              failures = int(suite.attrib.get('failures', 0))
              errors = int(suite.attrib.get('errors', 0))
              skipped = int(suite.attrib.get('skipped', 0))
              rows.append((path.stem.replace('test-results-', ''), tests, failures, errors, skipped))

          coverage_path = Path('artifacts/coverage/coverage.xml')
          coverage_value = 'n/a'
          if coverage_path.exists():
              root = ET.parse(coverage_path).getroot()
              coverage_value = f"{float(root.attrib.get('line-rate', 0)) * 100:.2f}%"

          lines = [
              '## CI test summary',
              '',
              f"- Backend matrix: **{os.environ['BACKEND_MATRIX_RESULT']}**",
              f"- Backend coverage: **{coverage_value}** ({os.environ['BACKEND_COVERAGE_RESULT']})",
              f"- Frontend checks: **{os.environ['FRONTEND_RESULT']}**",
              '',
              '| Suite | Tests | Failures | Errors | Skipped |',
              '| --- | ---: | ---: | ---: | ---: |',
          ]
          for suite, tests, failures, errors, skipped in rows:
              lines.append(f'| {suite} | {tests} | {failures} | {errors} | {skipped} |')
          Path('pr-test-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publish sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: pr-test-summary.md
