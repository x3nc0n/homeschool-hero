name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

env:
  COVERAGE_FAIL_UNDER: '76'
  CI_IMAGE_NAME: homeschool-hero:ci

jobs:
  backend-tests:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-test.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements.txt
          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

      - name: Run pytest with coverage
        env:
          TESTING: '1'
        run: |
          rm -rf .pytest-state
          python -m pytest -vv --cov=backend --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=${COVERAGE_FAIL_UNDER}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  migration-checks:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: homeschool_hero_ci
          POSTGRES_USER: homeschool
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homeschool -d homeschool_hero_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-test.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f backend/requirements-test.txt ]; then
            python -m pip install -r backend/requirements-test.txt
          fi

      - name: Verify Alembic migrations
        env:
          APP_ENV: test
          TESTING: '1'
          DATABASE_URL: postgresql+asyncpg://homeschool:changeme@127.0.0.1:5432/homeschool_hero_ci
        run: |
          python -m alembic -c backend/alembic.ini upgrade head
          python -m alembic -c backend/alembic.ini downgrade base
          python -m alembic -c backend/alembic.ini upgrade head

  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Detect npm scripts
        id: scripts
        run: |
          node <<'EOF'
          const scripts = require('./package.json').scripts || {};
          const fs = require('fs');
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_lint=${Boolean(scripts.lint)}\nhas_test=${Boolean(scripts.test)}\n`,
          );
          EOF

      - name: Run lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm test

  container-checks:
    name: Container checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --pull -t "${CI_IMAGE_NAME}" .

      - name: Scan image with Trivy policy gate
        id: trivy-policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignorefile: .trivyignore

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CI_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignorefile: .trivyignore

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Enforce Trivy vulnerability policy
        if: steps.trivy-policy.outcome == 'failure'
        run: |
          echo "Trivy found HIGH or CRITICAL vulnerabilities."
          exit 1

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: 'true'
