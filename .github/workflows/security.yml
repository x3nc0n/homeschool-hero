name: Security

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SECURITY_IMAGE_NAME: homeschool-hero:security

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            setup: python
          - language: javascript-typescript
            setup: node
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.setup == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements-test.txt

      - name: Install Python dependencies
        if: matrix.setup == 'python'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ -f backend/requirements-test.txt ]; then
            python -m pip install -r backend/requirements-test.txt
          fi

      - name: Set up Node.js
        if: matrix.setup == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.setup == 'node'
        working-directory: frontend
        run: npm ci

      - name: Build frontend for analysis
        if: matrix.setup == 'node'
        working-directory: frontend
        run: npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Prepare CodeQL artifact directory
        run: mkdir -p codeql-results

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results/${{ matrix.language }}.sarif

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-codeql-${{ matrix.language }}
          path: codeql-results/${{ matrix.language }}.sarif
          if-no-files-found: error

  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --pull -t "${SECURITY_IMAGE_NAME}" .

      - name: Scan image with Trivy policy gate
        id: trivy-policy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SECURITY_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SECURITY_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: json
          output: trivy-results.json
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload Trivy JSON artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-trivy-json
          path: trivy-results.json
          if-no-files-found: error

      - name: Generate Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SECURITY_IMAGE_NAME }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Enforce Trivy vulnerability policy
        if: steps.trivy-policy.outcome == 'failure'
        run: |
          echo "Trivy found HIGH or CRITICAL vulnerabilities."
          exit 1
