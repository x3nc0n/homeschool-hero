upstream homeschool_app {
    server app:8000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
server_tokens off;

# Development / behind-a-reverse-proxy configuration.
# This config listens on HTTP only and does NOT redirect to HTTPS — that is
# intentional.  When running locally or behind an upstream TLS-terminating
# proxy (e.g. Traefik, Cloudflare, an ALB), HTTPS is handled by the outer
# layer.  For production deployments that need TLS enforcement at this layer,
# use nginx-tls.conf instead, which includes an HTTP→HTTPS redirect and full
# HSTS / certificate configuration.
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Block path traversal: raw ".." and all URL-encoded variants
    # (%2e%2e, %2e., .%2e — case-insensitive so %2E variants also match).
    if ($request_uri ~* "(\.\.)|(%2e%2e)|(%2e\.)|(\.%2e)") {
        return 400;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://homeschool_app;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /api/auth/register {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://homeschool_app;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location ~ ^/api/invitations/[0-9]+/accept$ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://homeschool_app;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://homeschool_app;
        proxy_http_version 1.1;
        proxy_hide_header Server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
